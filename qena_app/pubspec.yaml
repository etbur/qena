name: qena_app
description: Qenagebeya — Ethiopia's Multi-Vendor Marketplace
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0

  # State management
  provider: ^6.1.1

  # Local storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # UI
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  badges: ^3.1.2
  fluttertoast: ^8.2.4
  smooth_page_indicator: ^1.1.0

  # Navigation
  go_router: ^13.2.0

  # Other
  intl: any
  url_launcher: ^6.2.5
  flutter_rating_bar: ^4.0.1
  lottie: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
