<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Domain Checker</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.container{
    width:450px;
    margin:80px auto;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

input{
    width:100%;
    padding:12px;
    font-size:16px;
    margin-bottom:15px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#007bff;
    color:#fff;
    border:none;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0056b3;
}

#result{
    margin-top:20px;
    font-size:18px;
    font-weight:bold;
    text-align:center;
}
</style>

</head>
<body>

<div class="container">

<h2 align="center">Domain Availability Checker</h2>

<input
type="text"
id="domain"
placeholder="example.com">

<button onclick="checkDomain()">
Check Domain
</button>

<div id="result"></div>

</div>

<script>
async function checkDomain(){

    const domain=document.getElementById("domain").value.trim();

    const result=document.getElementById("result");

    if(domain==""){
        result.innerHTML="<span style='color:red'>Enter a domain.</span>";
        return;
    }

    result.innerHTML="Checking...";

    try{

        const response=await fetch("https://rdap.org/domain/"+domain);

        if(response.status===404){

            result.innerHTML="<span style='color:green'>✅ Domain is Available</span>";

        }else if(response.ok){

            result.innerHTML="<span style='color:red'>❌ Domain is Already Registered</span>";

        }else{

            result.innerHTML="<span style='color:orange'>⚠ Unable to determine domain status.</span>";

        }

    }catch(error){

        result.innerHTML="<span style='color:red'>Request failed. RDAP may block browser requests (CORS). Use a backend proxy if this occurs.</span>";

    }

}
</script>

</body>
</html>
